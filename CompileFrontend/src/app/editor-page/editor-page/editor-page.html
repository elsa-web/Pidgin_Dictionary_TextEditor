<!-- ══════════════════════════════════════════
     PidginCheck — Editor Page
════════════════════════════════════════════ -->

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

      </svg>

      <span class="brand-pidgin">Pidgin</span><span class="brand-check">Check</span>

<!-- MAIN EDITOR AREA -->
<main class="editor-main">

  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <div class="editor-container">

    <!-- ── Toolbar Row ── -->
    <div class="toolbar">
      <div class="toolbar-left">

        <!-- Hidden file input -->
        <input
          #fileInput
          type="file"
          accept=".txt,.doc,.docx"
          style="display:none"
          (change)="onFileSelected($event)" />

        <!-- Upload button -->
        <app-neon-button
          label="Upload File"
          variant="primary"
          (clicked)="triggerUpload()">
        </app-neon-button>

      </div>

      <!-- Right: word/char count + Download -->
      <div class="toolbar-right">
        <span class="word-count">
          {{ wordCount }} words · {{ charCount }} chars
        </span>
        <app-neon-button
          label="Download"
          variant="outline"
          (clicked)="downloadDocument()">
        </app-neon-button>
      </div>
    </div>

    <!-- ── Text Editor Panel ── -->
    <div class="editor-panel">

      <!-- Panel Header -->
      <div class="panel-header">
        <svg class="panel-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
        <span class="panel-title">Text Editor</span>
      </div>

      <div class="panel-divider"></div>

      <!-- Textarea + Highlight Layer -->
      <div class="editor-wrap">
        <div #highlightLayer class="highlight-layer"></div>
        <textarea
          #editorArea
          class="editor-textarea"
          [(ngModel)]="editorText"
          (ngModelChange)="onTextChange()"
          (click)="onEditorClick($event)"
          (scroll)="onScroll($event)"
          placeholder="Type or paste your text here...">
        </textarea>
      </div>

      <!-- Suggestion Popup — inside editor-panel -->
      <div class="suggestion-popup"
           *ngIf="popup.visible"
           [style.top.px]="popup.top"
           [style.left.px]="popup.left">
        <div class="popup-error-type">{{ popup.errorType }}</div>
        <div class="popup-suggestions">
          <button
            *ngFor="let s of popup.suggestions"
            class="popup-suggestion-btn"
            (click)="applySuggestion(s)">
            {{ s }}
          </button>
        </div>
      </div>

    </div>
    <!-- end editor-panel -->

    <!-- ── Legend Strip ── -->
    <div class="legend-strip">
      <div class="legend-item">
        <span class="legend-line legend-red"></span>
        <span class="legend-label">Spelling</span>
      </div>
      <div class="legend-item">
        <span class="legend-line legend-blue"></span>
        <span class="legend-label">Syntax</span>
      </div>
      <div class="legend-item">
        <span class="legend-line legend-green"></span>
        <span class="legend-label">Semantic</span>
      </div>
    </div>

  </div>
</main>
